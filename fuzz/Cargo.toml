[package]
name = "secret-manager-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone: the parent is a single crate, not a workspace, and the fuzz
# targets must never be pulled into a normal `cargo build` of it.
[workspace]

[package.metadata]
cargo-fuzz = true

[lib]
name = "smfuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"
zeroize = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

# `fuzzing` exposes the internal helpers that sit on attacker-fed input;
# `test-util` gives the cheap KDF parameters, without which every target that
# touches a vault would spend its whole budget inside Argon2 instead of in the
# parser we are trying to break.
[dependencies.secret-manager]
path = ".."
features = ["fuzzing", "test-util"]

[profile.release]
debug = 1

[[bin]]
name = "vault_decode"
path = "fuzz_targets/vault_decode.rs"
test = false
doc = false
bench = false

